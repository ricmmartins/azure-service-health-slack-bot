name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python ${{ matrix.python-version }} validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
      - name: Run pytest
        run: python -m pytest -q
      - name: Run flake8
        run: python -m flake8 .
      - name: Test cross-platform operational CLIs
        run: >-
          python -m pytest -q
          test/test_manage_alert_scopes.py
          test/test_configure_secure_webhook.py
          test/test_cli_subprocess.py
      - name: Verify CLI entry points
        run: |
          python scripts/manage_alert_scopes.py --help
          python scripts/configure_secure_webhook.py --help
      - name: Verify installed Azure CLI special-character boundary
        run: >-
          python -c "from scripts.manage_alert_scopes import AzureCli;
          q=chr(39)+chr(34)+'a&b%'+chr(34)+chr(39);
          assert AzureCli().invoke('version','--query',q)==chr(34)+'a&b%'+chr(34)"

  bicep:
    name: Bicep build and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Azure CLI login-free bicep build
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep lint --file infra/main.bicep
          az bicep build --file infra/day2/service-health-alert-scope.bicep --stdout > /dev/null
          az bicep lint --file infra/day2/service-health-alert-scope.bicep

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t azure-service-health-slack-bot:ci .
