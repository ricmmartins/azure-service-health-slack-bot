name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: ${{ matrix.check-name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            check-name: Python 3.12 validation (ubuntu-latest)
          - os: ubuntu-latest
            python-version: "3.13"
            check-name: Python validation (ubuntu-latest)
          - os: macos-latest
            python-version: "3.13"
            check-name: Python validation (macos-latest)
          - os: windows-latest
            python-version: "3.13"
            check-name: Python validation (windows-latest)
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-ops.txt
          pip install -r requirements-test.txt
      - name: Run pytest
        run: python -m pytest -q
      - name: Run flake8
        run: python -m flake8 .
      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt -r requirements-ops.txt
      - name: Test cross-platform operational CLIs
        run: >-
          python -m pytest -q
          test/test_manage_alert_scopes.py
          test/test_configure_secure_webhook.py
          test/test_cli_subprocess.py
      - name: Verify CLI entry points
        run: |
          python scripts/manage_alert_scopes.py --help
          python scripts/configure_secure_webhook.py --help
          python scripts/manage_slack_token.py --help
      - name: Verify installed Azure CLI special-character boundary
        run: >-
          python -c "from scripts.manage_alert_scopes import AzureCli;
          q=chr(39)+chr(34)+'a&b%'+chr(34)+chr(39);
          assert AzureCli().invoke('version','--query',q)==chr(34)+'a&b%'+chr(34)"

  bicep:
    name: Bicep build and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Azure CLI login-free bicep build
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep lint --file infra/main.bicep
          az bicep build --file infra/day2/service-health-alert-scope.bicep --stdout > /dev/null
          az bicep lint --file infra/day2/service-health-alert-scope.bicep

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build image
        run: docker build -t azure-service-health-slack-bot:ci .
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: azure-service-health-slack-bot:ci
          format: table
          ignore-unfixed: true
          severity: CRITICAL
          exit-code: "1"
