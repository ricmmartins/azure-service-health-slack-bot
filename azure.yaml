name: azure-service-health-slack-bot
metadata:
  template: azure-service-health-slack-bot@0.0.1
services:
  app:
    project: .
    language: python
    host: containerapp
    docker:
      path: ./Dockerfile
      context: .
hooks:
  preprovision:
    windows:
      shell: pwsh
      run: python ./scripts/configure_secure_webhook.py
    posix:
      shell: sh
      run: python3 ./scripts/configure_secure_webhook.py
